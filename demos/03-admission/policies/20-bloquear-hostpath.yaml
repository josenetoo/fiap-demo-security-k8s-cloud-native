apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: bloquear-hostpath
  annotations:
    policies.kyverno.io/title: Proibir montagem do host
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: nada-de-hostpath
      match:
        any:
          - resources:
              kinds: ["Pod"]
      validate:
        message: >-
          Volume hostPath nao e permitido: da acesso direto ao disco do no.
          Utilize PVC, ConfigMap, Secret ou emptyDir.
        foreach:
          - list: "request.object.spec.volumes[]"
            deny:
              conditions:
                any:
                  - key: "{{ element.keys(@) }}"
                    operator: AnyIn
                    value: ["hostPath"]
