# Policy Kyverno em Enforce, complementar aos perfis fixos do PSA.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: bloquear-privilegiado
  annotations:
    policies.kyverno.io/title: Proibir containers privilegiados
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: nada-de-privileged
      match:
        any:
          - resources:
              kinds: ["Pod"]
      # Exclui namespaces de infraestrutura cujos agentes exigem privilegios.
      exclude:
        any:
          - resources:
              namespaces: ["kube-system", "kube-public", "kube-node-lease", "kyverno", "falco"]
      validate:
        message: >-
          Container privilegiado nao e permitido. Se voce precisa de uma
          capability especifica, peca ela em securityContext.capabilities.add
          e justifique no PR.
        pattern:
          spec:
            =(ephemeralContainers):
              - =(securityContext):
                  =(privileged): "false"
            =(initContainers):
              - =(securityContext):
                  =(privileged): "false"
            containers:
              - =(securityContext):
                  =(privileged): "false"
