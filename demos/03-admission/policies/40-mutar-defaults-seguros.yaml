# Injeta securityContext quando ausente.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: mutar-defaults-seguros
  annotations:
    policies.kyverno.io/title: Injetar securityContext seguro
spec:
  rules:
    - name: default-securitycontext
      match:
        any:
          - resources:
              kinds: ["Pod"]
              # Inclui dev, sem PSA, para isolar a mutacao Kyverno.
              namespaces: ["producao", "dev"]
      mutate:
        patchStrategicMerge:
          spec:
            +(securityContext):
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            containers:
              - (name): "*"
                +(securityContext):
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop: ["ALL"]
