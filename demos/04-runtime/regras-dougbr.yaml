# Regras Falco personalizadas, com saida em portugues.
# As regras nao filtram por k8s.ns.name: esse campo pode nao estar populado
# conforme a versao do Falco, o que impediria o disparo. O namespace ainda
# aparece na saida quando disponivel.
- rule: DOUGBR Shell aberto em container
  desc: Alguem abriu um shell interativo dentro de um container
  condition: >
    spawned_process and container
    and shell_procs
    and proc.tty != 0
  output: >
    [DOUGBR] Shell aberto dentro do container
    (usuario=%user.name comando=%proc.cmdline
    pod=%k8s.pod.name ns=%k8s.ns.name imagem=%container.image.repository)
  priority: WARNING
  tags: [dougbr, shell, mitre_execution]

- rule: DOUGBR Leitura de arquivo sensivel
  desc: Leitura de /etc/shadow ou de credenciais dentro do container
  condition: >
    open_read and container
    and (fd.name = /etc/shadow
         or fd.name startswith /root/.ssh
         or fd.name startswith /var/run/secrets/kubernetes.io)
  output: >
    [DOUGBR] Arquivo sensivel lido dentro do container
    (arquivo=%fd.name comando=%proc.cmdline
    pod=%k8s.pod.name ns=%k8s.ns.name)
  priority: WARNING
  tags: [dougbr, filesystem, mitre_credential_access]
