# Pod nao privilegiado com shell para disparar alertas Falco de shell e leitura de credenciais.
apiVersion: v1
kind: Pod
metadata:
  name: observado
  namespace: producao
  labels: { app: observado }
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: app
      image: alpine:3.20
      command: ["sleep", "infinity"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
