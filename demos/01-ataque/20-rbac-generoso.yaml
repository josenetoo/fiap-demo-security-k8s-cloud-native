# A ServiceAccount recebe cluster-admin; qualquer Pod que a utilize controla o cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-legado
  namespace: ataque
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: app-legado-cluster-admin
subjects:
  - kind: ServiceAccount
    name: app-legado
    namespace: ataque
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
