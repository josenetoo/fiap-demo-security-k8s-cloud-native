# Variante de demonstracao que falha no gate: analisa os artefatos inseguros
# (Dockerfile.inseguro, com base completa, root e segredo embutido). O Trivy
# detecta a configuracao incorreta e o segredo, e o job encerra com erro.
# Execucao manual apenas.
name: security-pipeline-fail-demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: "Gate — artefatos inseguros"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy — configuracao do Dockerfile inseguro
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: demos/02-build/Dockerfile.inseguro
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Trivy — segredo embutido
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: demos/02-build
          scanners: secret
          exit-code: "1"
