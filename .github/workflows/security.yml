# Pipeline de seguranca — DOUGBR
# Jobs: code-scan (segredos e configuracao) e build-scan (vulnerabilidades e SBOM).
# A imagem e construida no runner e analisada localmente; nao e publicada em
# registry, portanto nao requer autenticacao nem secrets adicionais.
name: security-pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # permite disparar manualmente pela UI

permissions:
  contents: read

jobs:
  # ---------- Code: segredos e IaC ----------
  code-scan:
    name: "1. Code — segredos e misconfig"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gitleaks (segredos no historico)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy config (Dockerfile e manifestos)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"      # falha o job em caso de configuracao incorreta

  # ---------- Container: build local + scan de vulnerabilidade ----------
  build-scan:
    name: "2. Container — build e scan de CVE"
    runs-on: ubuntu-latest
    needs: code-scan
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Imagem construida no daemon do runner (load: true), sem publicacao.
      - name: Build da imagem SEGURA (distroless)
        uses: docker/build-push-action@v6
        with:
          context: demos/02-build
          file: demos/02-build/Dockerfile.seguro
          load: true
          tags: dougbr/app:ci

      - name: Trivy image (CVEs)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: dougbr/app:ci
          severity: HIGH,CRITICAL
          exit-code: "1"      # falha o job em caso de vulnerabilidade critica
          ignore-unfixed: true

      - name: Gerar SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: image
          image-ref: dougbr/app:ci
          format: cyclonedx
          output: sbom.cdx.json

      - name: Publicar SBOM como artefato
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
