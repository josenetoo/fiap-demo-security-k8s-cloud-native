# Pipeline de seguranca — DOUGBR
# Jobs: code-scan (segredos e configuracao) e build-scan (vulnerabilidades e SBOM).
# Este pipeline analisa os artefatos seguros (Dockerfile.seguro e a aplicacao)
# e conclui com sucesso. A imagem e construida no runner e analisada localmente;
# nao e publicada em registry, portanto nao requer autenticacao nem secrets.
name: security-pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-scan:
    name: "1. Code — segredos e configuracao"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy — configuracao do Dockerfile
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: demos/02-build/Dockerfile.seguro
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Trivy — segredos no codigo da aplicacao
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: demos/02-build/app
          scanners: secret
          exit-code: "1"

  build-scan:
    name: "2. Container — build e analise de vulnerabilidades"
    runs-on: ubuntu-latest
    needs: code-scan
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem segura (distroless)
        run: docker build -f demos/02-build/Dockerfile.seguro -t dougbr/app:ci demos/02-build

      - name: Trivy — vulnerabilidades na imagem
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: dougbr/app:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy — gerar SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: dougbr/app:ci
          format: cyclonedx
          output: sbom.cdx.json

      - name: Publicar SBOM como artefato
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
