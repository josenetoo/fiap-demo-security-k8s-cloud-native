# Gates: scans de configuracao e segredos usam exit-code 1.
# Informativo: vulnerabilidades da imagem usam exit-code 0; o SBOM e publicado.
name: security-pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-scan:
    name: "1. Code — segredos e configuracao"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy — configuracao do Dockerfile
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: demos/02-build/Dockerfile.seguro
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Trivy — segredos no codigo da aplicacao
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: demos/02-build/app
          scanners: secret
          exit-code: "1"

  build-scan:
    name: "2. Container — build e analise de vulnerabilidades"
    runs-on: ubuntu-latest
    needs: code-scan
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem segura (distroless)
        run: docker build -f demos/02-build/Dockerfile.seguro -t dougbr/app:ci demos/02-build

      # Informativo: achados da imagem nao encerram o job; a correcao ocorre por rebuild com uma toolchain atualizada.
      - name: Trivy — vulnerabilidades na imagem (informativo)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: dougbr/app:ci
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Trivy — gerar SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: dougbr/app:ci
          format: cyclonedx
          output: sbom.cdx.json

      - name: Publicar SBOM como artefato
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
